[project]
name = "tiny-training"
version = "0.0.0"
description = "Tiny-Training: a modular LLM training framework (workspace root)"
readme = "readme.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tiny-training-basic",
    "tiny-training-system",
    "tiny-training-data",
    "tiny-training-rl",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-timeout",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "Tiny-Training-basic",
    "Tiny-Training-System",
    "Tiny-Training-Data",
    "Tiny-Training-RL",
]

[tool.uv.sources]
tiny-training-basic = { workspace = true }
tiny-training-system = { workspace = true }
tiny-training-data = { workspace = true }
tiny-training-rl = { workspace = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"
