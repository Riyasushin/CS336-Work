[project]
name = "tiny-training-system"
version = "0.0.0"
description = "Tiny-Training system layer: kernel fusion / distributed / MoE / profiling"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tiny-training-basic",
    "torch~=2.11.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tiny_training_system"
module-root = "src"

[tool.uv.sources]
tiny-training-basic = { workspace = true }
