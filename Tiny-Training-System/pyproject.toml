[project]
name = "tiny-training-system"
version = "0.0.0"
description = "Tiny-Training system layer: kernel fusion / distributed / MoE / profiling"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tiny-training-basic",
    "einops>=0.8",
    "numpy>=2.4",
    "torch~=2.11.0",
    "triton>=3.5 ; sys_platform == 'linux'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tiny_training_system"]
package-dir = { "tiny_training_system" = "src" }

[tool.uv.sources]
tiny-training-basic = { workspace = true }

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit.*",
    "ignore:Attempting to run cuBLAS:UserWarning",
    "ignore:TensorFloat32:UserWarning",
]
