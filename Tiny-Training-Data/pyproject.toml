[project]
name = "tiny-training-data"
version = "0.0.0"
description = "Tiny-Training data layer: filtering / dedup / quality classification"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tiny-training-basic",
    "xopen>=2.0",
    "resiliparse>=0.15",
    "fasttext>=0.9",
    "mmh3>=5.1",
    "nltk>=3.9",
    "fastwarc>=0.15",
    "tldextract>=5.3",
    "tqdm>=4.67",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tiny_training_data"]
package-dir = { "tiny_training_data" = "src" }

[tool.uv.sources]
tiny-training-basic = { workspace = true }

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"
