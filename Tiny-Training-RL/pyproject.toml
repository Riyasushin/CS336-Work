[project]
name = "tiny-training-rl"
version = "0.0.0"
description = "Tiny-Training RL layer: SFT / Expert Iteration / GRPO / DPO / rollout"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tiny-training-basic",
    "torch~=2.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tiny_training_rl"]
package-dir = { "tiny_training_rl" = "src" }

[tool.uv.sources]
tiny-training-basic = { workspace = true }
